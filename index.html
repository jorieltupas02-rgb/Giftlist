
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiftList</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f5fa;color:#29243a}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:bold}
.primary{background:#b77bd1;color:white}
.secondary{background:#eee7f3;color:#594466}
.danger{background:#fbe5e9;color:#b33c55}
.hidden{display:none!important}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{background:white;padding:30px;border-radius:20px;width:min(100%,420px);box-shadow:0 8px 30px #30204412}
.brand{font-size:26px;font-weight:800;color:#8f59aa}
.auth-card h1{margin-top:28px}
.field{display:grid;gap:7px;margin:15px 0}
input,select,textarea{width:100%;padding:12px;border:1px solid #ded6e5;border-radius:9px;background:white}
.auth-card button.primary{width:100%;margin-top:10px}
.link{background:none;color:#985cb0;padding:0}
.notice{padding:12px;border-radius:9px;background:#f1eaf8;margin:12px 0}
.error{background:#ffe9eb;color:#a12d42}
.success{background:#e6f7ee;color:#176b4c}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.sidebar{background:#392b49;color:white;padding:25px 18px;display:flex;flex-direction:column;gap:30px}
.sidebar .brand{color:#f0c9ff}
.nav{display:grid;gap:8px}
.nav button{text-align:left;background:transparent;color:white}
.nav button.active,.nav button:hover{background:#59436b}
.side-bottom{margin-top:auto;border-top:1px solid #665574;padding-top:18px}
.main{padding:30px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}
.topbar h1{margin:0}
.topbar p{color:#857c8e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}
.stat,.panel{background:white;border:1px solid #eee7f2;border-radius:15px;padding:20px}
.stat small{color:#82768b}
.stat h2{font-size:30px;margin:10px 0 0}
.panel{margin-bottom:20px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.panel-head h2{margin:0;font-size:19px}
.filters{display:flex;gap:10px;margin-bottom:15px}
.filters input{max-width:400px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:left;padding:13px;border-bottom:1px solid #eee7f2}
th{background:#f8f4fa;color:#665575;font-size:13px}
.pill{padding:5px 9px;border-radius:20px;font-size:12px}
.yes{background:#e2f6eb;color:#24764c}
.no{background:#fff1d9;color:#926514}
.row-actions{display:flex;gap:6px}
.row-actions button{padding:7px 9px}
.empty{text-align:center;padding:30px;color:#897e91}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}
.full{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.check-row{display:flex;align-items:center;gap:8px;margin:15px 0}
.check-row input{width:auto}
.modal-backdrop{position:fixed;inset:0;background:#20152d88;display:grid;place-items:center;padding:20px}
.modal{background:white;padding:25px;border-radius:16px;width:min(100%,400px)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.mobile-menu{display:none}
@media(max-width:750px){
.app{grid-template-columns:1fr}
.sidebar{min-height:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:14px}
.nav,.side-bottom{display:none}
.mobile-menu{display:block}
.main{padding:18px}
.stats{gap:8px}
.stat{padding:13px}
.stat h2{font-size:23px}
}
@media(max-width:520px){
.topbar{align-items:flex-start}
.topbar h1{font-size:23px}
.stats{grid-template-columns:1fr 1fr}
.stat:last-child{grid-column:1/-1}
.form-grid{grid-template-columns:1fr}
.full{grid-column:auto}
.filters{flex-direction:column}
.filters input{max-width:none}
.form-actions{flex-direction:column}
.form-actions button{width:100%}
}
</style>
</head>
<body>

<section id="authScreen" class="auth-wrap">
<div class="auth-card">
<div class="brand">GiftList</div>
<p style="color:#897e91">Your personal gift organizer</p>
<h1 id="authTitle">Welcome back</h1>
<p id="authSubtitle">Log in to your account.</p>
<div id="authNotice" class="notice hidden"></div>
<form id="authForm">
<div class="field">
<label>Email address</label>
<input id="authEmail" type="email" required placeholder="you@example.com">
</div>
<div class="field">
<label>Password</label>
<input id="authPassword" type="password" minlength="6" required placeholder="Your password">
</div>
<button class="primary" id="authSubmit">Log In</button>
</form>
<p style="text-align:center;margin-top:20px">
<span id="switchText">Don't have an account?</span>
<button class="link" id="authSwitch" type="button">Sign Up</button>
</p>
</div>
</section>

<div id="appScreen" class="app hidden">
<aside class="sidebar">
<div class="brand">GiftList</div>
<nav class="nav">
<button class="active" data-page="dashboard">Dashboard</button>
<button data-page="gifts">My Gifts</button>
<button data-page="giftform">Add Gift</button>
</nav>
<div class="side-bottom">
<small>SIGNED IN AS</small>
<div id="sideEmail"></div>
<button id="logoutBtn" class="secondary" style="margin-top:15px">Log Out</button>
</div>
<button id="mobileLogout" class="mobile-menu secondary">Log Out</button>
</aside>

<main class="main">
<header class="topbar">
<div>
<h1 id="pageTitle">Dashboard</h1>
<p id="pageSubtitle">A clear view of your gift plans.</p>
</div>
<button id="addTop" class="primary">+ Add Gift</button>
</header>

<div id="appNotice" class="notice hidden"></div>

<section id="dashboardPage">
<div class="stats">
<div class="stat"><small>Total gifts</small><h2 id="totalCount">0</h2></div>
<div class="stat"><small>Purchased</small><h2 id="purchasedCount">0</h2></div>
<div class="stat"><small>Not purchased</small><h2 id="pendingCount">0</h2></div>
</div>
<div class="panel">
<div class="panel-head"><h2>Recent gifts</h2><button class="secondary" data-page="gifts">View all</button></div>
<div id="recentTable"></div>
</div>
</section>

<section id="giftsPage" class="hidden">
<div class="panel">
<div class="panel-head"><h2>My Gifts</h2><button class="primary" data-page="giftform">+ Add Gift</button></div>
<div class="filters">
<input id="searchBox" placeholder="Search gifts...">
<select id="statusFilter">
<option value="all">All statuses</option>
<option value="yes">Purchased</option>
<option value="no">Not purchased</option>
</select>
</div>
<div id="allTable"></div>
</div>
</section>

<section id="giftformPage" class="hidden">
<div class="panel">
<div class="panel-head"><h2 id="formTitle">Gift Details</h2><button class="secondary" id="cancelForm">Cancel</button></div>
<form id="giftForm">
<input type="hidden" id="giftId">
<div class="form-grid">
<div class="field">
<label>Gift name *</label>
<input id="giftName" required>
</div>
<div class="field">
<label>Recipient *</label>
<input id="recipient" required>
</div>
<div class="field">
<label>Occasion *</label>
<select id="occasion" required>
<option value="">Choose occasion</option>
<option>Birthday</option>
<option>Christmas</option>
<option>Anniversary</option>
<option>Graduation</option>
<option>Valentine's Day</option>
<option>Wedding</option>
<option>Thank You</option>
<option>Just Because</option>
<option>Other</option>
</select>
</div>
<div class="field">
<label>Price (PHP)</label>
<input id="price" type="number" min="0" step="0.01">
</div>
<div class="field full">
<label>Notes</label>
<textarea id="notes" rows="3"></textarea>
</div>
</div>
<label class="check-row"><input id="purchased" type="checkbox"> Already purchased</label>
<div class="form-actions">
<button type="button" id="deleteFromForm" class="danger hidden">Delete Gift</button>
<button type="button" id="cancelForm2" class="secondary">Cancel</button>
<button type="submit" id="saveGiftBtn" class="primary">Save Gift</button>
</div>
</form>
</div>
</section>
</main>
</div>

<div id="confirmModal" class="modal-backdrop hidden">
<div class="modal">
<h2 id="modalTitle">Are you sure?</h2>
<p id="modalMessage"></p>
<div class="modal-actions">
<button id="modalCancel" class="secondary">Cancel</button>
<button id="modalConfirm" class="primary">Confirm</button>
</div>
</div>
</div>

<script>
const SUPABASE_URL="https://gkhuehjdkmnxvfqcbpnh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_XRBH0BAPyypqPVcqLtis7Q_izNrYBs3";

const $=id=>document.getElementById(id);
let db,currentUser,gifts=[],authMode="login",pendingConfirm=null;

const escapeHTML=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=value=>value===null||value===""||value===undefined?"—":new Intl.NumberFormat("en-PH",{style:"currency",currency:"PHP"}).format(Number(value));

function notice(id,message,type=""){
$(id).textContent=message;
$(id).className="notice"+(type?" "+type:"");
}
function hideNotice(id){$(id).classList.add("hidden")}

function setAuthMode(mode){
authMode=mode;
$("authTitle").textContent=mode==="login"?"Welcome back":"Create your account";
$("authSubtitle").textContent=mode==="login"?"Log in to your account.":"Sign up to start your gift list.";
$("authSubmit").textContent=mode==="login"?"Log In":"Create Account";
$("switchText").textContent=mode==="login"?"Don't have an account?":"Already have an account?";
$("authSwitch").textContent=mode==="login"?"Sign Up":"Log In";
hideNotice("authNotice");
}

function showPage(page){
["dashboard","gifts","giftform"].forEach(p=>$(p+"Page").classList.toggle("hidden",p!==page));
document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
const titles={dashboard:"Dashboard",gifts:"My Gifts",giftform:$("giftId").value?"Edit Gift":"Add Gift"};
$("pageTitle").textContent=titles[page];
$("pageSubtitle").textContent=page==="dashboard"?"A clear view of your gift plans.":page==="gifts"?"Manage your gift records.":"Keep your gift details organized.";
if(page==="gifts")renderGiftTables();
}

function showAuth(){
currentUser=null;
$("appScreen").classList.add("hidden");
$("authScreen").classList.remove("hidden");
}

function showApp(user){
currentUser=user;
$("authScreen").classList.add("hidden");
$("appScreen").classList.remove("hidden");
$("sideEmail").textContent=user.email||"Signed in";
showPage("dashboard");
loadGifts();
}

function giftRows(items){
if(!items.length)return '<div class="empty">No gifts found. Add your first gift!</div>';
return `<div class="table-wrap"><table>
<thead><tr><th>Gift</th><th>Recipient</th><th>Occasion</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
<tbody>${items.map(g=>`<tr>
<td><strong>${escapeHTML(g.name)}</strong></td>
<td>${escapeHTML(g.recipient)}</td>
<td>${escapeHTML(g.occasion)}</td>
<td>${money(g.price)}</td>
<td><span class="pill ${g.purchased?"yes":"no"}">${g.purchased?"Purchased":"Not purchased"}</span></td>
<td><div class="row-actions"><button class="secondary" data-edit="${g.id}">Edit</button><button class="danger" data-delete="${g.id}">Delete</button></div></td>
</tr>`).join("")}</tbody></table></div>`;
}

function bindGiftActions(){
document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editGift(b.dataset.edit));
document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>confirmDelete(b.dataset.delete));
}

function renderGiftTables(){
const q=$("searchBox").value.trim().toLowerCase();
const filter=$("statusFilter").value;
const items=gifts.filter(g=>
[g.name,g.recipient,g.occasion,g.notes].some(v=>String(v||"").toLowerCase().includes(q))&&
(filter==="all"||(filter==="yes"&&g.purchased)||(filter==="no"&&!g.purchased))
);
$("allTable").innerHTML=giftRows(items);
bindGiftActions();
}

function renderDashboard(){
const bought=gifts.filter(g=>g.purchased).length;
$("totalCount").textContent=gifts.length;
$("purchasedCount").textContent=bought;
$("pendingCount").textContent=gifts.length-bought;
$("recentTable").innerHTML=giftRows(gifts.slice(0,5));
bindGiftActions();
}

async function loadGifts(){
if(!db||!currentUser)return;
const {data,error}=await db.from("gifts").select("*").order("created_at",{ascending:false});
if(error){notice("appNotice","Could not load gifts: "+error.message,"error");return}
gifts=data||[];
renderDashboard();
renderGiftTables();
}

function clearGiftForm(){
$("giftForm").reset();
$("giftId").value="";
$("formTitle").textContent="Gift Details";
$("saveGiftBtn").textContent="Save Gift";
$("deleteFromForm").classList.add("hidden");
}

function startAdd(){
clearGiftForm();
showPage("giftform");
}

function editGift(id){
const g=gifts.find(x=>String(x.id)===String(id));
if(!g)return;
clearGiftForm();
$("giftId").value=g.id;
$("giftName").value=g.name||"";
$("recipient").value=g.recipient||"";
$("occasion").value=g.occasion||"";
$("price").value=g.price??"";
$("notes").value=g.notes||"";
$("purchased").checked=!!g.purchased;
$("formTitle").textContent="Edit Gift";
$("saveGiftBtn").textContent="Save Changes";
$("deleteFromForm").classList.remove("hidden");
showPage("giftform");
}

function askConfirm(title,message,label,callback,danger=false){
$("modalTitle").textContent=title;
$("modalMessage").textContent=message;
$("modalConfirm").textContent=label;
$("modalConfirm").className=danger?"danger":"primary";
pendingConfirm=callback;
$("confirmModal").classList.remove("hidden");
}

function closeModal(){
$("confirmModal").classList.add("hidden");
pendingConfirm=null;
}

async function confirmDelete(id){
const g=gifts.find(x=>String(x.id)===String(id));
if(!g)return;
askConfirm("Delete this gift?","This gift will be permanently deleted.","Delete",async()=>{
const {error}=await db.from("gifts").delete().eq("id",id);
if(error){notice("appNotice",error.message,"error");return}
await loadGifts();
notice("appNotice","Gift deleted successfully.","success");
showPage("gifts");
},true);
}

async function logout(){
askConfirm("Log out of GiftList?","Are you sure you want to log out of your account?","Log Out",async()=>{
const {error}=await db.auth.signOut();
if(error){notice("appNotice",error.message,"error");return}
gifts=[];
showAuth();
setAuthMode("login");
notice("authNotice","You have been logged out.","success");
});
}

$("authSwitch").onclick=()=>setAuthMode(authMode==="login"?"signup":"login");

$("authForm").onsubmit=async e=>{
e.preventDefault();
const email=$("authEmail").value.trim();
const password=$("authPassword").value;
$("authSubmit").disabled=true;
try{
if(authMode==="login"){
const {data,error}=await db.auth.signInWithPassword({email,password});
if(error)throw error;
showApp(data.user);
}else{
const {data,error}=await db.auth.signUp({email,password});
if(error)throw error;
if(data.session)showApp(data.user);
else notice("authNotice","Account created. Check your email if confirmation is required.","success");
}
}catch(err){notice("authNotice",err.message,"error")}
finally{$("authSubmit").disabled=false;$("authSubmit").textContent=authMode==="login"?"Log In":"Create Account"}
};

document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>b.dataset.page==="giftform"?startAdd():showPage(b.dataset.page));
$("addTop").onclick=startAdd;
$("cancelForm").onclick=$("cancelForm2").onclick=()=>showPage("gifts");
$("logoutBtn").onclick=$("mobileLogout").onclick=logout;
$("modalCancel").onclick=closeModal;
$("modalConfirm").onclick=async()=>{
const fn=pendingConfirm;
closeModal();
if(fn)await fn();
};
$("confirmModal").onclick=e=>{if(e.target===$("confirmModal"))closeModal()};
$("searchBox").oninput=renderGiftTables;
$("statusFilter").onchange=renderGiftTables;

$("giftForm").onsubmit=async e=>{
e.preventDefault();
const id=$("giftId").value;
const payload={
name:$("giftName").value.trim(),
recipient:$("recipient").value.trim(),
occasion:$("occasion").value,
price:$("price").value===""?null:Number($("price").value),
notes:$("notes").value.trim(),
purchased:$("purchased").checked
};
if(payload.price!==null&&(!Number.isFinite(payload.price)||payload.price<0)){
notice("appNotice","Enter a valid price.","error");
return;
}
$("saveGiftBtn").disabled=true;
try{
let result;
if(id)result=await db.from("gifts").update(payload).eq("id",id);
else result=await db.from("gifts").insert({...payload,user_id:currentUser.id});
if(result.error)throw result.error;
await loadGifts();
notice("appNotice",id?"Gift updated.":"Gift added.","success");
showPage("gifts");
}catch(err){notice("appNotice","Could not save gift: "+err.message,"error")}
finally{$("saveGiftBtn").disabled=false}
};

$("deleteFromForm").onclick=()=>confirmDelete($("giftId").value);

(async()=>{
try{
db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const {data:{session},error}=await db.auth.getSession();
if(error)throw error;
if(session)showApp(session.user);
else showAuth();
db.auth.onAuthStateChange((_event,session)=>{
if(session&&!currentUser)showApp(session.user);
else if(!session&&currentUser)showAuth();
});
}catch(err){
notice("authNotice","Could not connect to Supabase. Check your project URL and key.","error");
}
})();
</script>
</body>
  </html>
